<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sven3Dprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECECEC;--ink:#111111;--mute:#6A6A6A;--card:#FFFFFF;--line:#D2D2D2;--acc:#111111;--teal:#555555}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:28px 20px 0}
.wrap{max-width:1000px;margin:0 auto}
.brand{font-weight:800;font-size:clamp(34px,8vw,64px);letter-spacing:-.03em;line-height:1}
.brand b{color:var(--acc)}
.layers{height:26px;margin:18px 0 0;background:repeating-linear-gradient(to bottom,var(--acc) 0 3px,transparent 3px 6px);-webkit-mask:linear-gradient(90deg,#000 0,#000 30%,transparent);mask:linear-gradient(90deg,#000 0,#000 30%,transparent)}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;align-items:center}
nav button{background:none;border:0;color:#cfd8dc;font:inherit;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button:hover{color:#fff}nav button.on{background:#fff;color:var(--ink)}
nav .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
h2{font-size:28px;letter-spacing:-.02em;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;background:repeating-linear-gradient(to bottom,#dfe6e3 0 4px,#d3dcd8 4px 8px)}
.card .b{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:19px}.card p{margin:0;color:var(--mute);font-size:15px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;color:var(--mute);font-size:14px}
button.btn,.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 16px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn.acc{background:var(--acc);color:#14202B}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.heart{background:none;border:0;font-size:24px;cursor:pointer;color:var(--acc);line-height:1}
form.f,.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:22px;display:grid;gap:10px}
input,textarea,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
label{font-size:14px;color:var(--mute);display:grid;gap:4px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.roll{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:10px}
.dot{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--teal)}
.bar i.low{background:var(--acc)}
.rr{display:flex;gap:6px;align-items:center}.rr input{width:90px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.msg{background:var(--card);border-left:4px solid var(--acc);padding:10px 14px;margin-bottom:10px}
.msg small{color:var(--mute)}
dialog{border:0;border-radius:8px;padding:22px;width:min(380px,92vw)}dialog::backdrop{background:#14202bcc}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;display:none;z-index:9}
.empty{color:var(--mute);padding:30px 0}
.notice{background:#fff3e8;border:1px solid var(--acc);padding:16px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.layers{animation:rise .9s ease-out}@keyframes rise{from{height:0}}}
.bar2{display:grid;grid-template-columns:1fr 140px;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#14202B}
.card .chip{align-self:flex-start;cursor:default;font-size:12px;padding:2px 10px}
[data-open]{cursor:pointer}
dialog{background:var(--card);color:var(--ink)}#det{width:min(560px,94vw);max-height:90vh}
header{background:#14202B}
[data-theme=dark]{--bg:#121212;--ink:#F0F0F0;--card:#1D1D1D;--line:#333333;--mute:#9A9A9A;--acc:#F0F0F0;--teal:#BBBBBB}
[data-theme=dark] .btn,[data-theme=dark] #toast,[data-theme=dark] nav button.on{color:#111}
[data-theme=dark] input,[data-theme=dark] textarea,[data-theme=dark] select{background:#121212;color:var(--ink)}
@media (max-width:640px){.roll{grid-template-columns:28px 1fr}.roll .rr{grid-column:1/-1;flex-wrap:wrap}}
header{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line)}
.brand b{color:var(--mute)}
nav button{color:var(--mute)}nav button:hover{color:var(--ink)}
nav button.on{background:var(--ink);color:var(--bg)}
button.btn,.btn{color:var(--bg)}
.btn.acc{background:var(--acc);color:var(--bg)}
.btn.ghost{background:none;color:var(--ink)}
.bar i.low{background:repeating-linear-gradient(45deg,var(--ink) 0 4px,var(--mute) 4px 8px)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.notice{background:var(--card);border-color:var(--ink)}
dialog::backdrop{background:#000000b3}
#toast{color:var(--bg)}
.ph,.card img{background:repeating-linear-gradient(to bottom,#e2e2e2 0 4px,#d6d6d6 4px 8px)}
[data-theme=dark] .ph{background:repeating-linear-gradient(to bottom,#262626 0 4px,#1d1d1d 4px 8px)}
.feat{margin-bottom:22px}.feat .card{display:grid;grid-template-columns:1fr 1fr}.feat .card img,.feat .ph{height:100%;aspect-ratio:auto;min-height:200px}
@media (max-width:640px){.feat .card{grid-template-columns:1fr}.feat .card img,.feat .ph{aspect-ratio:4/3;min-height:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand">Sven<b>3D</b>print</div>
  <div class="layers"></div>
  <nav id="nav"></nav>
</div></header>
<main id="view"></main>

<dialog id="dlg"><form id="auth" style="display:grid;gap:10px">
  <h2 id="atitle" style="font-size:22px;margin:0">Inloggen</h2>
  <label id="nm" hidden>Naam<input id="name"></label>
  <label>E-mail<input id="email" type="email" required autocomplete="email"></label>
  <label>Wachtwoord<input id="pw" type="password" minlength="6" required autocomplete="current-password"></label>
  <button class="btn acc" id="asub">Inloggen</button>
  <button type="button" class="btn ghost" id="aswap">Nog geen account? Registreren</button>
  <button type="button" class="btn ghost" id="aclose">Sluiten</button>
</form></dialog>
<dialog id="det"><div id="detc"></div></dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === INSTELLEN: vul jouw Supabase-gegevens in (Project Settings > API) ===
const SUPABASE_URL = 'https://kigjqasrizifysxpfvip.supabase.co';
const SUPABASE_KEY = 'JOUW_ANON_PUBLIC_KEY';
// =========================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2600); };
const fmt = d => new Date(d).toLocaleDateString('nl-NL', {day:'numeric', month:'long', year:'numeric'});

if (SUPABASE_URL.startsWith('JOUW')) {
  $('#view').innerHTML = '<div class="notice"><b>Bijna klaar.</b> Vul bovenaan in index.html je Supabase-URL en sleutel in (zie de uitleg).</div>';
  throw new Error('Supabase niet ingesteld');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null, me = null, tab = 'portfolio', projects = [], favs = new Set(), unread = 0, newReq = 0, counts = {}, settings = {};
const CATS = ['Alle', 'Decoratie', 'Functioneel', 'Speelgoed', 'Cosplay', 'Onderdelen', 'Overig'];
let q = '', cat = 'Alle', sort = 'new';
try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'); } catch (e) {}
async function toggleFav(id) {
  if (!user) { $('#det').close(); return $('#dlg').showModal(); }
  if (favs.has(id)) await sb.from('favorites').delete().eq('project_id', id);
  else await sb.from('favorites').insert({ project_id: id });
  await load();
}

const canAdd = () => me && (me.is_owner || me.can_add);
const canFil = () => me && (me.is_owner || me.can_filament);

async function load() {
  const { data: { session } } = await sb.auth.getSession();
  user = session?.user || null; me = null; favs = new Set();
  if (user) {
    me = (await sb.from('profiles').select('*').eq('id', user.id).single()).data;
    (await sb.from('favorites').select('project_id')).data?.forEach(f => favs.add(f.project_id));
  }
  projects = (await sb.from('projects').select('*').order('created_at', { ascending: false })).data || [];
  unread = me?.is_owner ? ((await sb.from('messages').select('id', { count: 'exact', head: true }).eq('is_read', false)).count || 0) : 0;
  counts = {};
  ((await sb.rpc('fav_counts')).data || []).forEach(c => counts[c.project_id] = +c.n);
  settings = {};
  ((await sb.from('site_settings').select('*')).data || []).forEach(r => settings[r.key] = r.value);
  newReq = me?.is_owner ? ((await sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'nieuw')).count || 0) : 0;
  render();
}
sb.auth.onAuthStateChange(() => load());

function nav() {
  const t = [['portfolio', 'Portfolio'], ['about', 'Over Sven']];
  if (user) t.push(['favs', 'Favorieten'], ['req', 'Aanvragen' + (newReq ? ` (${newReq})` : '')], ['msg', 'Bericht aan Sven']);
  if (canFil()) t.push(['fil', 'Filament']);
  if (me?.is_owner) t.push(['admin', 'Beheer' + (unread ? ` (${unread})` : '')]);
  $('#nav').innerHTML = t.map(([k, l]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${l}</button>`).join('') +
    '<span class="sp"></span><button id="th" aria-label="Donker of licht thema">◐</button>' + (user
      ? `<span style="color:var(--mute);font-size:14px">${esc(me?.name || user.email)}</span><button id="out">Uitloggen</button>`
      : '<button id="in">Inloggen</button>');
  document.querySelectorAll('nav [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  $('#out')?.addEventListener('click', () => sb.auth.signOut());
  $('#in')?.addEventListener('click', () => $('#dlg').showModal());
  $('#th').onclick = () => { const d = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = d; try { localStorage.setItem('theme', d); } catch (e) {} };
}

function card(p) {
  const mine = me && (me.is_owner || (me.can_add && p.created_by === user.id));
  return `<article class="card">${p.image_url ? `<img data-open="${p.id}" src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy">` : `<div class="ph" data-open="${p.id}"></div>`}
  <div class="b"><span class="chip">${esc(p.category || 'Overig')}</span><h3 data-open="${p.id}">${esc(p.title)}</h3><p>${esc(p.description)}</p>
  <div class="row"><span>${fmt(p.created_at)}</span><span>
    ${mine ? `<button class="btn ghost sm" data-del="${p.id}">Verwijderen</button>` : ''}
    <button class="heart" data-fav="${p.id}" aria-label="Favoriet">${favs.has(p.id) ? '♥' : '♡'}</button><small>${counts[p.id] || 0}</small></span></div></div></article>`;
}

const gal = p => {
  const u = p.images?.length ? p.images : (p.image_url ? [p.image_url] : []);
  if (!u.length) return '';
  return `<img id="big" src="${esc(u[0])}" alt="${esc(p.title)}" style="width:100%;border-radius:6px">` + (u.length > 1
    ? `<div class="rr" style="margin-top:6px;flex-wrap:wrap;justify-content:flex-start">${u.map(x => `<img data-th="${esc(x)}" src="${esc(x)}" alt="" style="width:64px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer">`).join('')}</div>` : '');
};

function openDetail(id) {
  const p = projects.find(x => x.id === id); if (!p) return;
  const spec = [['Categorie', p.category], ['Materiaal', p.material], ['Printtijd', p.print_hours ? p.print_hours + ' uur' : ''], ['Gewicht', p.grams ? p.grams + ' gram' : ''], ['Geplaatst', fmt(p.created_at)]].filter(x => x[1]);
  $('#detc').innerHTML = `${gal(p)}
    <h2 style="margin:14px 0 6px">${esc(p.title)}</h2><p style="color:var(--mute)">${esc(p.description)}</p>
    <table>${spec.map(x => `<tr><th>${x[0]}</th><td>${esc(x[1])}</td></tr>`).join('')}</table>
    <div class="rr" style="margin-top:14px;justify-content:space-between"><button class="btn ghost" id="dcl">Sluiten</button>
    <button class="btn acc" id="dfv">${favs.has(id) ? '♥ Favoriet' : '♡ Favoriet maken'}</button></div>`;
  $('#dcl').onclick = () => $('#det').close();
  document.querySelectorAll('[data-th]').forEach(t => t.onclick = () => $('#big').src = t.dataset.th);
  $('#dfv').onclick = async () => { await toggleFav(id); if (user) openDetail(id); };
  $('#det').showModal();
}

function bindCards() {
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDetail(+b.dataset.open));
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = () => toggleFav(+b.dataset.fav));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Dit item verwijderen?')) return;
    const { error } = await sb.from('projects').delete().eq('id', +b.dataset.del);
    error ? toast(error.message) : load();
  });
}

function drawGrid() {
  let l = projects.filter(p => (cat === 'Alle' || p.category === cat) &&
    (p.title + ' ' + (p.description || '') + ' ' + (p.material || '')).toLowerCase().includes(q.toLowerCase()));
  if (sort === 'old') l = [...l].reverse();
  if (sort === 'pop') l = [...l].sort((a, b) => (counts[b.id] || 0) - (counts[a.id] || 0));
  if (sort === 'az') l = [...l].sort((a, b) => a.title.localeCompare(b.title));
  $('#grid').innerHTML = l.length ? l.map(card).join('') : '<p class="empty">Niets gevonden.</p>';
  bindCards();
}

function feat() {
  const f = projects.find(p => String(p.id) === settings.featured);
  return f ? `<div class="feat"><h3 style="margin:0 0 8px">Uitgelicht</h3>${card(f)}</div>` : '';
}

function vAbout() {
  const f = projects.find(p => String(p.id) === settings.featured);
  const edit = me?.is_owner ? `<form class="f" id="sf"><h3 style="margin:0">Pagina aanpassen</h3>
    <label>Over Sven<textarea id="sa" rows="5">${esc(settings.about)}</textarea></label>
    <label>Contact (bijv. Instagram of e-mail)<input id="sc" value="${esc(settings.contact)}"></label>
    <label>Uitgelicht item<select id="sx"><option value="">Geen</option>${projects.map(p => `<option value="${p.id}" ${String(p.id) === settings.featured ? 'selected' : ''}>${esc(p.title)}</option>`).join('')}</select></label>
    <button class="btn acc">Opslaan</button></form>` : '';
  $('#view').innerHTML = `<h2>Over Sven</h2><p style="max-width:60ch;white-space:pre-line">${esc(settings.about || 'Sven maakt 3D-prints op bestelling en voor de fun. Kijk in het portfolio wat er recent is gemaakt.')}</p>
    ${settings.contact ? `<p><b>Contact:</b> ${esc(settings.contact)}</p>` : ''}${edit}${f ? `<div class="feat" style="margin-top:28px"><h3 style="margin:0 0 8px">Uitgelicht</h3>${card(f)}</div>` : ''}`;
  bindCards();
  $('#sf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const { error } = await sb.from('site_settings').upsert([{ key: 'about', value: $('#sa').value }, { key: 'contact', value: $('#sc').value }, { key: 'featured', value: $('#sx').value }]);
    error ? toast(error.message) : (toast('Opgeslagen'), load());
  });
}

function stats() {
  const h = projects.reduce((s, p) => s + (+p.print_hours || 0), 0), g = projects.reduce((s, p) => s + (+p.grams || 0), 0);
  const n = (v, l) => `<div><b style="font-size:26px">${v}</b><br>${l}</div>`;
  return `<div class="panel" style="grid-template-columns:repeat(3,1fr);text-align:center">${n(projects.length, 'prints')}${n(Math.round(h), 'uur geprint')}${n((g / 1000).toFixed(1), 'kilo filament')}</div>`;
}

function vPortfolio() {
  const add = canAdd() ? `<form class="f" id="addf"><h3 style="margin:0">Nieuw item toevoegen</h3>
    <label>Titel<input id="t" required></label><label>Beschrijving<textarea id="d" rows="2"></textarea></label>
    <label>Categorie<select id="c">${CATS.slice(1).map(c => `<option>${c}</option>`).join('')}</select></label>
    <label>Materiaal<input id="mt" placeholder="PLA zwart"></label>
    <div class="rr"><label style="flex:1">Printtijd (uur)<input id="ph" type="number" step="0.1" min="0"></label>
    <label style="flex:1">Gewicht (gram)<input id="gr" type="number" min="0"></label></div>
    <label>Foto's (max 6)<input id="img" type="file" accept="image/*" multiple></label><button class="btn acc">Plaatsen</button></form>` : '';
  $('#view').innerHTML = `<h2>Recent gemaakt</h2>${stats()}${feat()}${add}
    <div class="bar2"><input id="q" type="search" placeholder="Zoeken…" value="${esc(q)}" aria-label="Zoeken">
    <select id="so" aria-label="Sorteren"><option value="new">Nieuwste</option><option value="old">Oudste</option><option value="az">A–Z</option><option value="pop">Populairst</option></select></div>
    <div class="chips">${CATS.map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${c}">${c}</button>`).join('')}</div>
    <div class="grid" id="grid"></div>`;
  $('#so').value = sort;
  $('#q').oninput = e => { q = e.target.value; drawGrid(); };
  $('#so').onchange = e => { sort = e.target.value; drawGrid(); };
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; vPortfolio(); });
  drawGrid();
  $('#addf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button.acc'); btn.disabled = true;
    const urls = [];
    for (const [n, f] of [...$('#img').files].slice(0, 6).entries()) {
      const path = `${user.id}/${Date.now()}-${n}-${f.name.replace(/[^\w.-]/g, '_')}`;
      const up = await sb.storage.from('portfolio').upload(path, f);
      if (up.error) { btn.disabled = false; return toast(up.error.message); }
      urls.push(sb.storage.from('portfolio').getPublicUrl(path).data.publicUrl);
    }
    const { error } = await sb.from('projects').insert({ title: $('#t').value, description: $('#d').value, image_url: urls[0] || null, images: urls,
      category: $('#c').value, material: $('#mt').value || null, print_hours: +$('#ph').value || null, grams: +$('#gr').value || null });
    error ? (toast(error.message), btn.disabled = false) : (toast('Geplaatst'), load());
  });
}

function vFavs() {
  const l = projects.filter(p => favs.has(p.id));
  $('#view').innerHTML = '<h2>Jouw favorieten</h2>' + (l.length
    ? `<div class="grid">${l.map(card).join('')}</div>` : '<p class="empty">Tik op het hartje bij een item om het hier te bewaren.</p>');
  bindCards();
}

async function vMsg() {
  const { data = [] } = await sb.from('messages').select('*').eq('from_user', user.id).order('created_at', { ascending: false });
  $('#view').innerHTML = `<h2>Bericht aan Sven</h2><form class="f" id="mf">
    <label>Je bericht<textarea id="mb" rows="5" required></textarea></label><button class="btn acc">Versturen</button></form>
    <h2 style="margin-top:32px;font-size:22px">Jouw berichten</h2>` + (data.length ? data.map(m => `<div class="msg"><small>${fmt(m.created_at)}</small><div>${esc(m.body)}</div>
    ${m.reply ? `<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px"><small>Antwoord van Sven · ${fmt(m.replied_at)}</small><div>${esc(m.reply)}</div></div>` : '<small>Nog geen antwoord</small>'}</div>`).join('')
    : '<p class="empty">Je hebt nog niets verstuurd.</p>');
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('messages').insert({ body: $('#mb').value, from_name: me?.name || user.email });
    error ? toast(error.message) : (toast('Verstuurd'), vMsg());
  };
}

async function vFil() {
  const { data = [] } = await sb.from('filaments').select('*');
  const pc = r => r.meters_left / r.meters_total;
  data.sort((a, b) => pc(a) - pc(b));
  const low = data.filter(r => pc(r) < .2).length, tot = data.reduce((s, r) => s + +r.meters_left, 0);
  const big = c => `style="font-size:26px;${c || ''}"`;
  $('#view').innerHTML = `<h2>Filamentrollen</h2><div class="panel" style="grid-template-columns:repeat(3,1fr);text-align:center">
    <div><b ${big()}>${data.length}</b><br>rollen</div><div><b ${big()}>${Math.round(tot)}</b><br>meter over</div>
    <div><b ${big(low ? 'color:var(--acc)' : '')}>${low}</b><br>bijna leeg</div></div>` + (data.length ? data.map(r => {
    const p = Math.max(0, Math.min(100, pc(r) * 100));
    return `<div class="roll"><span class="dot" style="background:${esc(r.color)}"></span>
      <div><b>${esc(r.name)}</b> <span style="color:var(--mute)">${esc(r.material || '')}</span>${p < 20 ? ' <b style="color:var(--acc)">bijna leeg</b>' : ''}
      <div style="color:var(--mute);font-size:14px">${r.meters_left} / ${r.meters_total} m · bijgewerkt ${fmt(r.updated_at)}</div>
      <div class="bar"><i class="${p < 20 ? 'low' : ''}" style="width:${p}%"></i></div></div>
      <div class="rr"><input type="number" min="0" value="${r.meters_left}" data-m="${r.id}" aria-label="Meters over"><button class="btn sm" data-s="${r.id}">Zet op</button>
      <input type="number" min="0" placeholder="gebruikt" data-u="${r.id}" aria-label="Meters gebruikt"><button class="btn ghost sm" data-a="${r.id}">Aftrekken</button>
      ${me.is_owner ? `<button class="btn ghost sm" data-x="${r.id}" aria-label="Verwijderen">✕</button>` : ''}</div></div>`;
  }).join('') : '<p class="empty">Nog geen rollen. Voeg hieronder de eerste toe.</p>') +
  `<form class="f" id="rf"><h3 style="margin:0">Nieuwe rol</h3>
    <label>Naam (merk + kleur)<input id="rn" required></label><label>Materiaal<input id="rm" placeholder="PLA, PETG…"></label>
    <label>Kleur<input id="rc" type="color" value="#808080"></label>
    <label>Meters op een volle rol<input id="rt" type="number" value="330" min="1"></label>
    <button class="btn acc">Rol toevoegen</button></form>`;
  const save = async (id, v) => {
    const { error } = await sb.from('filaments').update({ meters_left: Math.max(0, v), updated_at: new Date().toISOString() }).eq('id', id);
    error ? toast(error.message) : (toast('Opgeslagen'), vFil());
  };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => save(+b.dataset.s, +document.querySelector(`[data-m="${b.dataset.s}"]`).value));
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const u = +document.querySelector(`[data-u="${b.dataset.a}"]`).value;
    if (u > 0) save(+b.dataset.a, data.find(r => r.id === +b.dataset.a).meters_left - u);
  });
  document.querySelectorAll('[data-x]').forEach(b => b.onclick = async () => {
    if (confirm('Rol verwijderen?')) { await sb.from('filaments').delete().eq('id', +b.dataset.x); vFil(); }
  });
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    const t = +$('#rt').value;
    const { error } = await sb.from('filaments').insert({ name: $('#rn').value, material: $('#rm').value, color: $('#rc').value, meters_total: t, meters_left: t });
    error ? toast(error.message) : vFil();
  };
}

async function vAdmin() {
  const [{ data: ps = [] }, { data: ms = [] }] = await Promise.all([
    sb.from('profiles').select('*').order('created_at'),
    sb.from('messages').select('*').order('created_at', { ascending: false })]);
  $('#view').innerHTML = `<h2>Wie mag wat?</h2><table><tr><th>Naam</th><th>Portfolio toevoegen</th><th>Filament-menu</th></tr>` +
    ps.map(p => `<tr><td>${esc(p.name)}<br><small style="color:var(--mute)">${esc(p.email)}</small></td>
      <td>${p.is_owner ? 'eigenaar' : `<input type="checkbox" style="width:auto" data-p="${p.id}" data-k="can_add" ${p.can_add ? 'checked' : ''}>`}</td>
      <td>${p.is_owner ? 'eigenaar' : `<input type="checkbox" style="width:auto" data-p="${p.id}" data-k="can_filament" ${p.can_filament ? 'checked' : ''}>`}</td></tr>`).join('') +
    `</table><h2 style="margin-top:32px">Berichten</h2>` + (ms.length ? ms.map(m =>
      `<div class="msg"><small>${esc(m.from_name)} · ${fmt(m.created_at)}${m.is_read ? '' : ' · <b style="color:var(--acc)">nieuw</b>'}</small><div>${esc(m.body)}</div>
       ${m.reply ? `<div style="margin-top:6px"><small>Jouw antwoord</small><div>${esc(m.reply)}</div></div>` : ''}
       <div class="rr" style="margin-top:8px"><input data-r="${m.id}" placeholder="Antwoord schrijven…" style="flex:1;width:auto">
       <button class="btn sm" data-rs="${m.id}">Antwoord</button>
       ${m.is_read ? '' : `<button class="btn ghost sm" data-rd="${m.id}">Gelezen</button>`}
       <button class="btn ghost sm" data-md="${m.id}">Verwijderen</button></div></div>`).join('') : '<p class="empty">Geen berichten.</p>');
  document.querySelectorAll('[data-k]').forEach(c => c.onchange = async () => {
    const { error } = await sb.from('profiles').update({ [c.dataset.k]: c.checked }).eq('id', c.dataset.p);
    error ? toast(error.message) : toast('Rechten bijgewerkt');
  });
  document.querySelectorAll('[data-rs]').forEach(b => b.onclick = async () => {
    const t = document.querySelector(`[data-r="${b.dataset.rs}"]`).value.trim(); if (!t) return;
    const { error } = await sb.from('messages').update({ reply: t, replied_at: new Date().toISOString(), is_read: true }).eq('id', +b.dataset.rs);
    error ? toast(error.message) : (toast('Antwoord verstuurd'), load());
  });
  document.querySelectorAll('[data-rd]').forEach(b => b.onclick = async () => { await sb.from('messages').update({ is_read: true }).eq('id', +b.dataset.rd); load(); });
  document.querySelectorAll('[data-md]').forEach(b => b.onclick = async () => { await sb.from('messages').delete().eq('id', +b.dataset.md); load(); });
}

const ST = ['nieuw', 'bezig', 'klaar', 'afgewezen'];
async function vReq() {
  const { data = [] } = await sb.from('requests').select('*').order('created_at', { ascending: false });
  const own = me.is_owner;
  $('#view').innerHTML = `<h2>${own ? 'Print-aanvragen' : 'Print aanvragen'}</h2>` + (own ? '' :
    `<form class="f" id="qf"><p style="margin:0;color:var(--mute)">Wil je iets laten printen? Beschrijf wat je wilt (maat, kleur, aantal). Sven laat je weten of het kan.</p>
    <label>Wat wil je laten printen?<input id="qt" required></label><label>Details<textarea id="qd" rows="4"></textarea></label>
    <button class="btn acc">Aanvraag versturen</button></form><h2 style="font-size:22px">Jouw aanvragen</h2>`) +
    (data.length ? data.map(r => `<div class="msg"><small>${own ? esc(r.from_name) + ' · ' : ''}${fmt(r.created_at)} · <b>${esc(r.status)}</b></small>
      <div><b>${esc(r.title)}</b></div><div>${esc(r.description)}</div>
      ${own ? `<div class="rr" style="margin-top:8px"><select data-st="${r.id}" style="width:130px">${ST.map(x => `<option ${x === r.status ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <input data-n="${r.id}" value="${esc(r.owner_note)}" placeholder="Notitie of prijs…" style="flex:1;width:auto">
        <button class="btn sm" data-qs="${r.id}">Opslaan</button><button class="btn ghost sm" data-rx="${r.id}" aria-label="Verwijderen">✕</button></div>`
      : `${r.owner_note ? `<div style="margin-top:6px"><small>Antwoord van Sven</small><div>${esc(r.owner_note)}</div></div>` : ''}${r.status === 'nieuw' ? `<button class="btn ghost sm" data-rx="${r.id}">Intrekken</button>` : ''}`}</div>`).join('')
    : '<p class="empty">Nog geen aanvragen.</p>');
  $('#qf')?.addEventListener('submit', async e => {
    e.preventDefault();
    const { error } = await sb.from('requests').insert({ title: $('#qt').value, description: $('#qd').value, from_name: me?.name || user.email });
    error ? toast(error.message) : (toast('Aanvraag verstuurd'), load());
  });
  document.querySelectorAll('[data-qs]').forEach(b => b.onclick = async () => {
    const id = b.dataset.qs;
    const { error } = await sb.from('requests').update({ status: document.querySelector(`[data-st="${id}"]`).value, owner_note: document.querySelector(`[data-n="${id}"]`).value }).eq('id', +id);
    error ? toast(error.message) : (toast('Opgeslagen'), load());
  });
  document.querySelectorAll('[data-rx]').forEach(b => b.onclick = async () => {
    if (confirm('Aanvraag verwijderen?')) { await sb.from('requests').delete().eq('id', +b.dataset.rx); load(); }
  });
}

function render() {
  const ok = { portfolio: 1, about: 1, favs: !!user, msg: !!user, req: !!user, fil: canFil(), admin: me?.is_owner };
  if (!ok[tab]) tab = 'portfolio';
  nav();
  ({ portfolio: vPortfolio, about: vAbout, favs: vFavs, req: vReq, msg: vMsg, fil: vFil, admin: vAdmin })[tab]();
}

// Inloggen / registreren
let reg = false;
const setMode = r => { reg = r; $('#atitle').textContent = r ? 'Account maken' : 'Inloggen'; $('#asub').textContent = r ? 'Registreren' : 'Inloggen';
  $('#aswap').textContent = r ? 'Al een account? Inloggen' : 'Nog geen account? Registreren'; $('#nm').hidden = !r; };
$('#aswap').onclick = () => setMode(!reg);
$('#aclose').onclick = () => $('#dlg').close();
$('#auth').onsubmit = async e => {
  e.preventDefault();
  const email = $('#email').value, password = $('#pw').value;
  const { error, data } = reg
    ? await sb.auth.signUp({ email, password, options: { data: { name: $('#name').value } } })
    : await sb.auth.signInWithPassword({ email, password });
  if (error) return toast(error.message);
  if (reg && !data.session) toast('Check je e-mail om je account te bevestigen');
  $('#dlg').close();
};
load();
</script>
</body>
</html>
